[project]
name = "hacom-ai-telco-engine"
version = "0.2.0"
description = "Applied-AI proof of concept for telco network operations: deterministic RAN KPI diagnostics with an agent and RAG layer on top."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
